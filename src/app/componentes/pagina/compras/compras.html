<div class="modulo-contenedor">
  <div class="cabecera-modulo">
    <div class="textos-cabecera">
      <h2>Compras</h2>
      <p>Catálogo de insumos, distribuidores y precios de reposición</p>
    </div>
    <button class="btn-primario-cafe" (click)="agregarCompra()">+ Nueva compra</button>
  </div>

  <div class="grid-productos">
    @for (item of productos; track item.id) {
      <div class="tarjeta-producto">
        <div class="placeholder-imagen">
          <svg width="28" height="28" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z"></path>
          </svg>
          <span>Imagen</span>
        </div>
        
        <div class="info-producto">
          <h4>{{ item.nombre }}</h4>
          <p>Categoría: {{ item.categoria }}</p>
        </div>

        <div class="precio-estado">
          <span class="precio">${{ item.precio }}.00</span>
          <span class="etiqueta {{ item.claseEtiqueta }}">{{ item.estado }}</span>
        </div>
      </div>
    }
  </div>
</div>
