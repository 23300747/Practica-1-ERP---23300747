@if (mostrarLayout()) {
  <div class="layout-principal">
    
    <header class="encabezado-superior">
      <div class="logo-titulo">
        <span class="icono-cafe">☕</span>
        <h1>Cafetería — Panel Interno</h1>
      </div>
      <button class="btn-salir" (click)="cerrarSesion()">Salir</button>
    </header>

    <div class="cuerpo-principal">
      <aside class="sidebar">
        <nav class="navegacion">
          <a routerLink="/dashboard" routerLinkActive="activo" class="nav-item">
            <img src="Panel.png" alt="Panel" class="icono" /> Panel principal
          </a>
          <a routerLink="/finanzas" routerLinkActive="activo" class="nav-item">
            <img src="Finanzas.png" alt="Finanzas" class="icono" /> Contabilidad y Finanzas
          </a>
          <a routerLink="/inventario" routerLinkActive="activo" class="nav-item">
            <img src="Hexagono.png" alt="Inventario" class="icono" /> Gestión de Inventario
          </a>
          <a routerLink="/ventas" routerLinkActive="activo" class="nav-item">
            <img src="Cuadrado.png" alt="Ventas" class="icono" /> Ventas y Facturación
          </a>
          <a routerLink="/compras" routerLinkActive="activo" class="nav-item">
            <img src="Compras.png" alt="Compras" class="icono" /> Compras
          </a>
          <a routerLink="/rh" routerLinkActive="activo" class="nav-item">
            <img src="Usuario.png" alt="RH" class="icono" /> Recursos Humanos
          </a>
        </nav>
      </aside>

      <main class="area-trabajo">
        <router-outlet></router-outlet>
      </main>
    </div>
    
  </div>
} @else {
  <div class="pantalla-login-contenedor">
    <router-outlet></router-outlet>
  </div>
}
